name: Refresh and deploy flight dashboard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "11 8,18 * * *"
      timezone: "Europe/Bratislava"
  workflow_dispatch:
    inputs:
      days:
        description: Počet dní, ktoré má skener prehľadať
        required: true
        default: "90"

concurrency:
  group: refresh-public-flight-dashboard
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    name: Scan flights and deploy GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SCAN_DAYS: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[refresh-data]') && '150' || inputs.days || '90' }}

    steps:
      - name: Check out FlightScanner
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh all dashboard data
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh-data]')
        run: python3 Main.py --days "$SCAN_DAYS"

      - name: Preserve latest scan on code-only deploy
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[refresh-data]')
        run: python3 scripts/preserve_production_data.py

      - name: Build public statistics data
        run: python3 scripts/build_statistics.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: HTML

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
