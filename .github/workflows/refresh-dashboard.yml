name: Refresh public flight dashboard

on:
  schedule:
    # GitHub používa UTC. Časy mimo celej hodiny znižujú pravdepodobnosť meškania.
    - cron: "17 5,17 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Počet dní, ktoré má skener prehľadať
        required: true
        default: "30"

concurrency:
  group: refresh-public-flight-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Scan flights and publish dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCAN_DAYS: ${{ inputs.days || '30' }}

    steps:
      - name: Check out private scanner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public repository token
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.FLIGHTSCANNER_WEB_TOKEN }}
        run: |
          if [ -z "$PUBLIC_REPO_TOKEN" ]; then
            echo "::error::Chýba secret FLIGHTSCANNER_WEB_TOKEN."
            exit 1
          fi

      - name: Refresh all dashboard data
        run: python3 Main.py --days "$SCAN_DAYS"

      - name: Check out public website
        uses: actions/checkout@v4
        with:
          repository: romanduris/FlightScanner-web
          token: ${{ secrets.FLIGHTSCANNER_WEB_TOKEN }}
          path: public-site

      - name: Copy dashboard to public repository
        run: |
          rsync -a HTML/ public-site/
          touch public-site/.nojekyll

      - name: Publish changed website
        working-directory: public-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Verejný dashboard už obsahuje rovnaké dáta."
            exit 0
          fi
          git commit -m "Refresh flight dashboard"
          git push origin HEAD:main
