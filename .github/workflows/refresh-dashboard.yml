name: Refresh and deploy flight dashboard

on:
  schedule:
    - cron: "0 9,12,15,18 * * *"
      timezone: "Europe/Bratislava"
  workflow_dispatch:
    inputs:
      days:
        description: Počet dní, ktoré má skener prehľadať
        required: true
        default: "30"

concurrency:
  group: refresh-public-flight-dashboard
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    name: Scan flights and deploy GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SCAN_DAYS: ${{ inputs.days || '30' }}

    steps:
      - name: Check out FlightScanner
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh all dashboard data
        run: python3 Main.py --days "$SCAN_DAYS"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: HTML

      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
